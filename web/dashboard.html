<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>three.js Good Case Radar</title>
  <style>
    :root{--ink:#18201d;--muted:#68736e;--line:#dce2de;--paper:#f7f8f6;--white:#fff;--green:#0d704b;--lime:#dff264;--blue:#dfeaff;--shadow:0 10px 28px rgba(20,35,28,.08)}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;letter-spacing:0}
    button,input,select{font:inherit}.shell{min-height:100vh}.topbar{background:#13251e;color:#fff;border-bottom:1px solid #294137}.topbar-inner{max-width:1440px;margin:auto;padding:22px 28px 20px}
    .brand-row{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:13px}.mark{width:38px;height:38px;border-radius:6px;background:var(--lime);color:#183024;display:grid;place-items:center;font-weight:900;font-size:18px}.brand h1{font-size:21px;margin:0;font-weight:760}.brand p{margin:2px 0 0;color:#aebeb7;font-size:12px}.stamp{color:#cbd6d1;font-variant-numeric:tabular-nums}
    main{max-width:1440px;margin:auto;padding:22px 28px 56px}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);background:var(--white);border-radius:8px;margin-bottom:16px}.metric{padding:17px 20px;border-right:1px solid var(--line)}.metric:last-child{border:0}.metric strong{display:block;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}.metric span{color:var(--muted);font-size:12px}
    .toolbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px;background:rgba(247,248,246,.94);backdrop-filter:blur(12px);border-block:1px solid var(--line);margin-bottom:16px}.search{position:relative;flex:1;min-width:220px}.search input{width:100%;height:40px;border:1px solid #cfd7d2;border-radius:6px;background:#fff;padding:0 38px 0 13px;color:var(--ink);outline:none}.search input:focus,select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(13,112,75,.1)}.search b{position:absolute;right:13px;top:9px;color:var(--muted);font-size:17px}select{height:40px;border:1px solid #cfd7d2;border-radius:6px;background:#fff;padding:0 32px 0 11px;color:var(--ink)}.result-count{white-space:nowrap;color:var(--muted);font-size:12px}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;min-height:310px;transition:transform .16s,border-color .16s,box-shadow .16s}.card:hover{transform:translateY(-2px);border-color:#aebbb4;box-shadow:var(--shadow)}.visual{height:112px;background:#e8ede9;position:relative;overflow:hidden}.visual img{width:100%;height:100%;object-fit:cover}.visual-placeholder{height:100%;display:flex;align-items:flex-end;padding:13px;background:linear-gradient(125deg,#dfeaff,#dff264);font-size:12px;font-weight:700;text-transform:uppercase;color:#29453a}.score{position:absolute;right:10px;top:10px;width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:#13251e;color:#fff;font-weight:800;border:3px solid var(--lime)}
    .card-body{padding:15px 16px 16px;display:flex;flex-direction:column;flex:1}.meta{display:flex;align-items:center;gap:7px;margin-bottom:9px;flex-wrap:wrap}.pill{font-size:11px;padding:2px 7px;border-radius:999px;background:#edf1ee;color:#52605a}.pill.code{background:#e0f3e9;color:#075c3c}.source{font-weight:750;color:var(--green);font-size:11px;text-transform:uppercase}.card h2{font-size:16px;line-height:1.35;margin:0 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.highlight{color:#46524d;margin:0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.card-actions{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:14px}.pre-score{font-size:11px;color:var(--muted)}.open{border:0;background:transparent;color:var(--green);font-weight:750;padding:6px 0;cursor:pointer}.open:hover{text-decoration:underline}
    .empty{grid-column:1/-1;padding:70px 20px;text-align:center;color:var(--muted);border:1px dashed #bdc8c2;border-radius:8px}.overlay{position:fixed;inset:0;z-index:20;background:rgba(12,20,16,.58);display:none;align-items:flex-start;justify-content:flex-end}.overlay.opened{display:flex}.panel{height:100%;width:min(620px,100%);background:#fff;padding:28px;overflow:auto;box-shadow:-18px 0 50px rgba(0,0,0,.18)}.panel-head{display:flex;justify-content:space-between;gap:20px}.panel h2{font-size:24px;line-height:1.3;margin:12px 0 20px}.close{width:36px;height:36px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:22px;line-height:1}.detail-block{padding:18px 0;border-top:1px solid var(--line)}.detail-block h3{margin:0 0 7px;font-size:12px;color:var(--muted);text-transform:uppercase}.detail-block p{margin:0;font-size:15px}.visit{display:inline-block;margin-top:22px;padding:11px 15px;border-radius:6px;background:var(--green);color:#fff;text-decoration:none;font-weight:750}.visit:hover{background:#095d3e}
    @media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.summary{grid-template-columns:repeat(2,1fr)}.metric:nth-child(2){border-right:0}.metric:nth-child(-n+2){border-bottom:1px solid var(--line)}}
    @media(max-width:620px){.topbar-inner,main{padding-left:16px;padding-right:16px}.brand-row{align-items:flex-start;flex-direction:column}.stamp{font-size:12px}.toolbar{position:static;flex-wrap:wrap;padding:10px 0}.search{flex-basis:100%}.toolbar select{flex:1;min-width:0}.result-count{width:100%}.grid{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}.panel{padding:20px}.card{min-height:290px}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar"><div class="topbar-inner"><div class="brand-row"><div class="brand"><div class="mark">3D</div><div><h1>three.js Good Case Radar</h1><p>Creative Web · 3D Art · Interactive Worlds</p></div></div><div class="stamp" id="stamp"></div></div></div></header>
    <main>
      <section class="summary" aria-label="数据概览"><div class="metric"><strong id="total">0</strong><span>今日案例</span></div><div class="metric"><strong id="sourceTotal">0</strong><span>内容来源</span></div><div class="metric"><strong id="codeTotal">0</strong><span>含代码案例</span></div><div class="metric"><strong id="avgScore">0</strong><span>平均推荐分</span></div></section>
      <section class="toolbar" aria-label="筛选工具"><label class="search"><input id="search" type="search" placeholder="搜索标题、亮点或可借鉴价值"><b aria-hidden="true">⌕</b></label><select id="source" aria-label="来源"><option value="all">全部来源</option></select><select id="code" aria-label="代码状态"><option value="all">全部类型</option><option value="yes">有代码</option><option value="no">无代码 / 待确认</option></select><select id="sort" aria-label="排序"><option value="recommendation">推荐分排序</option><option value="heuristic">预筛分排序</option><option value="newest">最新发布</option></select><span class="result-count" id="resultCount"></span></section>
      <section class="grid" id="grid"></section>
    </main>
  </div>
  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><article class="panel"><div class="panel-head"><span class="source" id="detailSource"></span><button class="close" id="close" aria-label="关闭详情">×</button></div><h2 id="detailTitle"></h2><div class="detail-block"><h3>核心亮点</h3><p id="detailHighlight"></p></div><div class="detail-block"><h3>可借鉴价值</h3><p id="detailValue"></p></div><div class="detail-block"><h3>评分</h3><p id="detailScores"></p></div><a class="visit" id="detailLink" target="_blank" rel="noopener noreferrer">查看原始内容 ↗</a></article></div>
  <script id="case-data" type="application/json">__CASE_DATA__</script>
  <script>
    const groups=['美术精选','技术备查','待验证','旧规则／未评估','排除','低优先级跳过'];
    const category=document.createElement('select');category.id='category';category.setAttribute('aria-label','分流分类');category.innerHTML=groups.map(x=>`<option>${x}</option>`).join('');document.querySelector('.toolbar').prepend(category);
    const DATA=JSON.parse(document.getElementById('case-data').textContent);const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const score=x=>x.art_total==null?0:Number(x.art_total)/10,hasCode=x=>Boolean(x.analysis?.has_code??x.has_code);let visible=[];
    function sourceLabel(s){return ({threejs_forum:'three.js Forum',creative_rss:'Editorial RSS',x_search:'X · 间接搜索',github:'GitHub',gitlab:'GitLab',npm:'npm',youtube:'YouTube',bluesky:'Bluesky',mastodon:'Mastodon',devto:'DEV',reddit:'Reddit',hackernews:'Hacker News',twitter:'X',discord:'Discord'})[s]||s}
    function render(){const q=$('#search').value.trim().toLowerCase(),src=$('#source').value,code=$('#code').value,sort=$('#sort').value;visible=DATA.filter(x=>{const a=x.analysis||{},text=[x.title,x.content,a.highlight,a.reusable_value,a.category].join(' ').toLowerCase();return(!q||text.includes(q))&&(src==='all'||x.source===src)&&(code==='all'||hasCode(x)===(code==='yes'))});visible.sort((a,b)=>sort==='newest'?new Date(b.published_at)-new Date(a.published_at):sort==='heuristic'?(b.heuristic_score||0)-(a.heuristic_score||0):score(b)-score(a)||(b.heuristic_score||0)-(a.heuristic_score||0));$('#resultCount').textContent=`显示 ${visible.length} / ${DATA.length}`;$('#grid').innerHTML=visible.length?visible.map((x,i)=>{const a=x.analysis||{},img=x.thumbnail_url;return `<article class="card"><div class="visual">${img?`<img src="${esc(img)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:`<div class="visual-placeholder">${esc(a.category||sourceLabel(x.source))}</div>`}<span class="score">${score(x)}</span></div><div class="card-body"><div class="meta"><span class="source">${esc(sourceLabel(x.source))}</span><span class="pill ${hasCode(x)?'code':''}">${hasCode(x)?'有代码':'无代码 / 待确认'}</span></div><h2>${esc(x.title||'Untitled')}</h2><p class="highlight">${esc(a.highlight||x.content||'暂无摘要')}</p><div class="card-actions"><span class="pre-score">预筛分 ${esc(x.heuristic_score||0)}</span><button class="open" data-index="${i}">查看详情 →</button></div></div></article>`}).join(''):'<div class="empty">没有符合当前筛选条件的案例</div>';document.querySelectorAll('.open').forEach(b=>b.onclick=()=>openDetail(visible[Number(b.dataset.index)]))}
    function openDetail(x){const a=x.analysis||{};$('#detailSource').textContent=`${sourceLabel(x.source)} · ${hasCode(x)?'有代码':'无代码 / 待确认'}`;$('#detailTitle').textContent=x.title||'Untitled';$('#detailHighlight').textContent=a.highlight||x.content||'暂无';$('#detailValue').textContent=a.reusable_value||'暂无';$('#detailScores').textContent=`推荐 ${score(x)}/10 · 视觉 ${a.visual_score||0}/10 · 技术 ${a.technical_score||0}/10 · 创新 ${a.innovation_score||0}/10 · 预筛 ${x.heuristic_score||0}`;$('#detailLink').href=x.url;$('#overlay').classList.add('opened');document.body.style.overflow='hidden';$('#close').focus()}
    function closeDetail(){ $('#overlay').classList.remove('opened');document.body.style.overflow='' }
    const sources=[...new Set(DATA.map(x=>x.source))].sort();$('#source').innerHTML+=[...sources].map(s=>`<option value="${esc(s)}">${esc(sourceLabel(s))}</option>`).join('');$('#total').textContent=DATA.length;$('#sourceTotal').textContent=sources.length;$('#codeTotal').textContent=DATA.filter(hasCode).length;$('#avgScore').textContent=DATA.length?(DATA.reduce((n,x)=>n+score(x),0)/DATA.length).toFixed(1):'0';$('#stamp').textContent=`更新于 ${new Date().toLocaleString('zh-CN',{hour12:false})}`;['search','source','code','sort'].forEach(id=>$('#'+id).addEventListener('input',render));$('#close').onclick=closeDetail;$('#overlay').onclick=e=>{if(e.target===$('#overlay'))closeDetail()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});render();
    const allItems=DATA.slice(),originalRender=render;
    render=function(){DATA.splice(0,DATA.length,...allItems.filter(x=>(x.selection_status||'旧规则／未评估')===category.value));originalRender();$('#total').textContent=allItems.filter(x=>x.selection_status==='美术精选').length;$('#resultCount').textContent=`${category.value} · ${visible.length} 条`;if(!visible.length&&category.value==='美术精选')$('#grid').innerHTML='<div class="empty">本期暂无符合标准的新案例</div>'};
    const categoryRender=render;render=function(){categoryRender();$('#sourceTotal').textContent=new Set(DATA.map(x=>x.source)).size;$('#codeTotal').textContent=DATA.filter(hasCode).length;const rated=DATA.filter(x=>x.art_total!=null);$('#avgScore').textContent=rated.length?(rated.reduce((n,x)=>n+x.art_total,0)/rated.length).toFixed(1):'未评估'};
    document.querySelectorAll('.metric span')[0].textContent='美术精选';document.querySelectorAll('.metric span')[3].textContent='当前分类平均美术分';
    category.innerHTML=['待审核','美术精选','技术备查','排除','全部候选'].map(x=>`<option>${x}</option>`).join('');
    let reviews={};try{reviews=JSON.parse(localStorage.getItem('threejs-manual-reviews')||'{}')}catch(e){}
    const reviewKey=x=>x.id||x.url,reviewStatus=x=>reviews[reviewKey(x)]?.status||'待审核';
    render=function(){DATA.splice(0,DATA.length,...allItems.filter(x=>category.value==='全部候选'||reviewStatus(x)===category.value));originalRender();$('#total').textContent=allItems.filter(x=>reviewStatus(x)==='美术精选').length;$('#sourceTotal').textContent=new Set(visible.map(x=>x.source)).size;$('#codeTotal').textContent=visible.filter(hasCode).length;$('#avgScore').textContent=allItems.filter(x=>reviewStatus(x)==='待审核').length;document.querySelectorAll('.metric span')[3].textContent='待审核候选';$('#resultCount').textContent=`${category.value} · ${visible.length} 条`;
      document.querySelectorAll('.card').forEach((card,i)=>{const x=visible[i],url=x.image_urls?.[0]||x.thumbnail_url;card.querySelector('.score').textContent='人工';if(url){const image=document.createElement('img');image.src=url;image.alt=x.title||'作品图片';image.loading='lazy';image.style.objectFit='contain';image.onerror=()=>image.replaceWith(document.createTextNode('图片加载失败，请查看原文'));const area=card.querySelector('.visual');area.querySelector('img,.visual-placeholder')?.replaceWith(image)}const row=document.createElement('div');row.style.cssText='display:flex;gap:10px;flex-wrap:wrap;margin-top:12px';['美术精选','技术备查','排除','待审核'].forEach(status=>{const b=document.createElement('button');b.className='open';b.textContent=status;b.onclick=()=>{if(status==='美术精选'&&reviewStatus(x)!==status&&allItems.filter(y=>reviewStatus(y)==='美术精选').length>=20){alert('当前日报最多精选20条');return}reviews[reviewKey(x)]={status,reviewed_at:new Date().toISOString()};try{localStorage.setItem('threejs-manual-reviews',JSON.stringify(reviews))}catch(e){alert('无法保存，请导出审核结果')}render()};row.append(b)});card.querySelector('.card-body').append(row)})};
    const exportButton=document.createElement('button');exportButton.className='open';exportButton.textContent='导出审核结果';exportButton.onclick=()=>{const blob=new Blob([JSON.stringify(allItems.map(x=>({...x,selection_status:reviewStatus(x),manual_review:reviews[reviewKey(x)]||null})),null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='threejs-manual-reviews.json';a.click();URL.revokeObjectURL(u)};document.querySelector('.toolbar').append(exportButton);
    category.addEventListener('input',render);render();
  </script>
</body>
</html>
